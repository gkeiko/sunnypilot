name: Sync Upstream CCNC PORT

on:
  schedule:
    # 每天凌晨 00:00 (UTC) 自動檢查並同步更新
    - cron: '0 0 * * *'
  # 支援在 GitHub 網頁 Actions 頁面手動點擊按鈕觸發
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ccnc-port
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 新增並抓取原作者上游儲存庫（請將 URL 替換為 CCNC PORT 原作者的實際 github 網址）
          git remote add upstream https://github.com/sunnypilot/sunnypilot.git || true
          git fetch upstream ccnc-port

          # 合併上游更新（優先保留上游新功能，若遇微小衝突自動處理）
          git merge upstream/ccnc-port -m "chore: sync upstream CCNC PORT updates" --no-edit || {
            echo "Merge conflict detected. Please resolve conflicts manually on your local PC."
            exit 1
          }

      - name: Push changes to personal repository
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ccnc-port
